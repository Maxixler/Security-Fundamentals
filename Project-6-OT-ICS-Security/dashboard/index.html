<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT/ICS SCADA Security Monitor</title>
    <meta name="description" content="Industrial SCADA HMI dashboard for OT/ICS security monitoring with PLC register visualization, anomaly detection, and attack alerts">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="scada-app">
        <header class="top-bar">
            <div class="brand">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <div><h1>OT / ICS SECURITY MONITOR</h1><span>Industrial SCADA — Crude Distillation Unit</span></div>
            </div>
            <div class="top-right">
                <div class="sis-status" id="sis-status">
                    <span class="sis-dot"></span><span>SIS NORMAL</span>
                </div>
                <span class="clock" id="clock">00:00:00</span>
            </div>
        </header>

        <div class="stats-bar">
            <div class="mini-stat"><span class="mini-val" id="stat-cmds">0</span><span class="mini-lbl">Commands</span></div>
            <div class="mini-stat"><span class="mini-val" id="stat-alerts">0</span><span class="mini-lbl">Alerts</span></div>
            <div class="mini-stat"><span class="mini-val" id="stat-blocked">0</span><span class="mini-lbl">Blocked</span></div>
            <div class="mini-stat"><span class="mini-val" id="stat-unauth">0</span><span class="mini-lbl">Unauth</span></div>
        </div>

        <div class="main-layout">
            <!-- Left: Process Units -->
            <div class="process-column">
                <section class="unit-panel" id="boiler-panel">
                    <div class="unit-header"><h2>🔥 Boiler System</h2><span class="unit-status" id="boiler-status">NORMAL</span></div>
                    <div class="gauges" id="boiler-gauges"></div>
                </section>
                <section class="unit-panel" id="pump-panel">
                    <div class="unit-header"><h2>⚙ Pump Station</h2><span class="unit-status" id="pump-status">NORMAL</span></div>
                    <div class="gauges" id="pump-gauges"></div>
                </section>
                <section class="unit-panel" id="cooling-panel">
                    <div class="unit-header"><h2>❄ Cooling Tower</h2><span class="unit-status" id="cooling-status">NORMAL</span></div>
                    <div class="gauges" id="cooling-gauges"></div>
                </section>
            </div>

            <!-- Right: Security -->
            <div class="security-column">
                <section class="panel alert-panel">
                    <div class="panel-head"><h2>🛡 Security Alerts</h2><span class="count-badge" id="alert-badge">0</span></div>
                    <div class="alert-list" id="alert-container"><p class="empty-msg">No security alerts</p></div>
                </section>
                <section class="panel event-panel">
                    <div class="panel-head"><h2>📋 Event Log</h2></div>
                    <div class="event-list" id="event-container"><p class="empty-msg">Waiting for events...</p></div>
                </section>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
